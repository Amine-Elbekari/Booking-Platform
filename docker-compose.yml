services:
  gatekeeper:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - rental_net
    depends_on:
      - api
      - frontend
  
  db:
    image: postgres:18.4-alpine
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - rental_net
    restart: unless-stopped
  
  redis:
    image: redis:8.6.4-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD}
    networks:
      - rental_net
    restart: unless-stopped

  api:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    env_file:
      - .env
    networks:
      - rental_net
    depends_on:
      - db
      - redis

  frontend:
    build: 
      context: ./frontend
      target: development # Change to 'production' when deploying
    env_file:
      - ./frontend/.env
    networks:
      - rental_net
    volumes:
      - ./frontend:/app
      - /app/node_modules

networks:
  rental_net:
    driver: bridge

volumes:
  postgres_data: